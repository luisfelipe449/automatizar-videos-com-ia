<span class="px-2 py-1 rounded-full text-xs font-medium
    {% if e.status == 'approved' %}bg-green-100 text-green-800
    {% elif e.status == 'rejected' %}bg-red-100 text-red-800
    {% elif e.status == 'rendered' %}bg-blue-100 text-blue-800
    {% else %}bg-yellow-100 text-yellow-800{% endif %}">
    {{ e.status }}
</span>
